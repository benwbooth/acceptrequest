[package]
name = "acceptrequest-server"
description = "Policy server: SQLite store, HTTPS API, Leptos UI host, ntfy notifications"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
acceptrequest-common.workspace = true
anyhow.workspace = true
argon2 = { version = "0.5", features = ["std"] }
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
chrono.workspace = true
hex = "0.4"
rand = "0.9"
rpassword = "7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "migrate", "macros"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
