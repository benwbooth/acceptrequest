[package]
name = "screentime-credprov"
description = "Windows Credential Provider: a Screen time tile on the sign-in screen to ask for more time"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
screentime-common.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security_Credentials",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Pipes",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"
